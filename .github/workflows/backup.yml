name: Backup diario de la base de datos

# Corre solo una vez al día (03:00 ART = 06:00 UTC) y también se puede
# disparar a mano desde la pestaña Actions ("Run workflow") para probar
# el proceso de restore sin esperar al cron.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # El postgresql-client que trae Ubuntu por defecto (v16) es más viejo que
      # el Postgres de Supabase (v17.x) — pg_dump se niega a volcar un server
      # más nuevo que él mismo. Se instala la v17 desde el repo oficial de
      # PostgreSQL (PGDG) para que coincida.
      - name: Instalar cliente de PostgreSQL 17 (misma versión que Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # --no-owner/--no-acl: el rol que crea la base al restaurar en otro
      # lugar no necesariamente se llama igual que en Supabase, así evita
      # que el restore falle por permisos que no existen del otro lado.
      # Ruta completa al binario de la v17 (no "pg_dump" a secas): el runner
      # ya trae la v16 preinstalada y esa sigue siendo la que resuelve el PATH
      # aunque se instale la v17 al lado.
      - name: Generar el dump
        run: /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.DATABASE_URL }}" --no-owner --no-acl -F c -f nexa-backup.dump

      # El repo es público: cualquier usuario de GitHub puede bajar los
      # artifacts. Por eso el dump se cifra (AES256) con la contraseña del
      # secret BACKUP_PASSPHRASE y el archivo sin cifrar se borra antes de
      # subir nada. Si el secret falta, el job falla en vez de subir el dump
      # en claro.
      - name: Cifrar el dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Falta el secret BACKUP_PASSPHRASE — no se sube el backup sin cifrar." >&2
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o nexa-backup.dump.gpg nexa-backup.dump <<< "$BACKUP_PASSPHRASE"
          rm nexa-backup.dump

      # Se guarda como artifact del propio run (no en el repo) — así nunca
      # queda un dump con datos de clientas en el historial de git.
      - name: Subir el dump cifrado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-backup-${{ github.run_id }}
          path: nexa-backup.dump.gpg
          retention-days: 30
