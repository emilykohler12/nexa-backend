name: CI backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_test
      JWT_SECRET: ci_jwt_secret_no_usar_en_produccion_1234567890
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_no_usar_en_produccion_0987654321
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: Admin1234!
      ADMIN_NAME: Admin CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Type-check (app + tests)
        run: npm run typecheck:all

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
