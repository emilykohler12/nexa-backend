<!-- src/jobs/templates/autoPromotion.html -->
<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

        <!-- Header -->
        <tr>
          <td style="background:linear-gradient(135deg,#069494,#047a7a);padding:32px;text-align:center;">
            <h1 style="color:#ffffff;margin:0;font-size:26px;font-weight:700;letter-spacing:1px;">Nexa</h1>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:40px 48px;">
            <h2 style="color:#1a1a1a;font-size:22px;font-weight:700;margin:0 0 12px;">{{TITLE}}, {{CLIENT_NAME}}!</h2>
            <p style="color:#555;font-size:15px;line-height:1.6;margin:0 0 20px;">
              {{INTRO}}
            </p>

            <table cellpadding="0" cellspacing="0" style="background:#f0fafa;border-radius:12px;padding:18px 22px;margin:0 0 24px;width:100%;">
              <tr><td style="color:#069494;font-size:20px;font-weight:700;">{{DISCOUNT_TEXT}}</td></tr>
            </table>

            {{MESSAGE_BLOCK}}

            <p style="color:#888;font-size:14px;margin:0;">Mostrá este mail en el local para aprovecharlo.</p>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background:#f9f9f9;padding:20px 48px;border-top:1px solid #eee;">
            <p style="color:#bbb;font-size:12px;margin:0;text-align:center;">
              © 2026 Nexa · Este email fue enviado automáticamente, no respondas a este mensaje.
            </p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
